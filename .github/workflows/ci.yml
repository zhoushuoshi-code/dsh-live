name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Build Relay container
        run: docker build --tag dsh-live-relay:ci .
      - name: Build installable tarball
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-live-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

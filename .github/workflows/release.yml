name: Preview release

on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Pack preview
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.tgz \
              --verify-tag \
              --prerelease \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

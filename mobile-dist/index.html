<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>DSH Live</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="mark">D</span><span>DSH LIVE</span></div>
      <div id="status" class="status" data-tone="working">Reading secure invitation…</div>
    </header>
    <section class="hero">
      <p class="eyebrow">APPROVAL INBOX</p>
      <h1>Your agent calls.<br><span>You decide.</span></h1>
      <p>Only explicit, one-time decisions. Your desktop always stays in control.</p>
    </section>
    <section id="inbox" class="inbox" aria-live="polite">
      <div id="empty" class="empty">
        <div class="pulse"></div>
        <strong>Waiting for your agent</strong>
        <span>Approval requests will appear here.</span>
      </div>
    </section>
  </main>
  <template id="approval-template">
    <article class="approval-card">
      <div class="card-top"><span class="risk-dot"></span><span>DECISION REQUIRED</span></div>
      <h2 data-field="tool"></h2>
      <p data-field="reason"></p>
      <div class="scope"><span>Scope</span><strong>Allow once only</strong></div>
      <p class="result" data-field="result" hidden></p>
      <div class="actions">
        <button class="reject" data-action="reject">Reject</button>
        <button class="allow" data-action="allow">Hold to allow once</button>
      </div>
    </article>
  </template>
  <script type="module" src="/mobile/main.js"></script>
</body>
</html>
